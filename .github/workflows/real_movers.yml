name: Run Real Movers Engine
working-directory: ${{ github.workspace }}
run: python real_movers_engine.py

on:
  schedule:
    # Runs every day at ~6:00 AM MT (13:00 UTC)
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  build-real-movers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml

      - name: Run Real Movers Engine
        run: |
          python real_movers_engine.py

      - name: Commit and push JSON
        run: |
          git config user.name "Real Movers Engine Bot"
          git config user.email "bot@users.noreply.github.com"
          git add real_movers.json
          git commit -m "Update real movers list" || echo "No changes to commit"
          git push
