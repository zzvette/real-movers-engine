name: Daily Real Movers Engine

on:
  schedule:
    # 6:00 AM Mountain Time = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scrapers
        run: |
          python github_scraper_runner.py

      - name: Commit and push JSON updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add *.json
          git commit -m "Daily screener update"
          git push
