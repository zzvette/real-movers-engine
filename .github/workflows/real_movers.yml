name: Real Movers Engine

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (example)
  workflow_dispatch:

jobs:
  build-real-movers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install yfinance
        pip install requests

    - name: Run Real Movers Engine
      run: python real_movers_engine.py

    - name: Commit JSON
      run: |
        git config user.name "Real Movers Engine Bot"
        git config user.email "actions@github.com"
        git add real_movers.json
        git commit -m "update real movers list" || echo "No changes to commit"

    - name: Push JSON
      run: git push origin main --force
