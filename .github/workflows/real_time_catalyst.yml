name: run-catalyst-engine

on:
  workflow_dispatch:

  schedule:
    # Premarket: every 5 minutes, 4:00–9:29 EST (approx 9–13 UTC)
    - cron: "*/5 9-13 * * 1-5"

    # Intraday: every 2 minutes, 9:30–16:00 EST (approx 14–20 UTC)
    - cron: "*/2 14-20 * * 1-5"

    # After hours: every 10 minutes, 16:00–20:00 EST (approx 20–23 UTC)
    - cron: "*/10 20-23 * * 1-5"

    # Night: every 30 minutes, 0:00–4:00 EST (approx 0–4 UTC)
    - cron: "*/30 0-4 * * 1-5"

jobs:
  catalyst-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run catalyst scraper
        run: |
          python github_scraper_runner.py

      - name: Commit catalyst outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add files only if they exist
          if ls catalyst_log.json 1> /dev/null 2>&1; then
            git add catalyst_log.json
          fi

          if ls daily_screener.json 1> /dev/null 2>&1; then
            git add daily_screener.json
          fi

          # Skip commit if nothing changed
          if git diff --cached --quiet; then
            echo "No catalyst files to commit — skipping."
          else
            git commit -m "Update catalyst snapshots"
            git push
          fi
