name: Market Data Scraper (Catalyst Engine)

on:
  schedule:
    # 7:00 AM MST / 9:00 AM EST
    - cron: "0 14 * * 1-5"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run catalyst screener
        run: |
          python github_scraper_runner.py

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add daily_screener.json real_movers.json catalyst_log.json
          git commit -m "Automated catalyst scrape update" || echo "No changes to commit"
          git push || echo "No changes to push"
