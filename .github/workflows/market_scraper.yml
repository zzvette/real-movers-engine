name: Market Data Scraper

on:
  schedule:
    # Morning pre-market scan: 9am EST / 7am MST
    - cron: "0 14 * * 1-5"
    # Optional: mid-day and close scans (keep or remove as you like)
    - cron: "0 17 * * 1-5"   # 12pm EST
    - cron: "0 21 * * 1-5"   # 4pm EST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper
        run: |
          python github_scraper_runner.py

      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add daily_screener.json real_movers.json catalyst_log.json
          git commit -m "Automated scrape update" || echo "No changes to commit"
          git push || echo "No changes to push"
